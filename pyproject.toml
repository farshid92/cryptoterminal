[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptoterminal"
version = "0.1.0"
description = "Bitcoin-first daily trading analysis system"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  # [NEW-DEP] Initial dependency set required for the Phase 0+ stack and validation harness.
  "ccxt==4.3.70",
  "pandas==2.2.3",
  "numpy==1.26.4",
  "numba==0.60.0",
  "scipy==1.14.1",
  "scikit-learn==1.5.2",
  "xgboost==2.1.3",
  "lightgbm==4.5.0",
  "torch==2.5.1",
  "pytorch-lightning==2.5.0",
  "pytorch-forecasting==1.1.1",
  "optuna==4.1.0",
  "mlflow==2.17.0",
  "fastapi==0.115.0",
  "uvicorn==0.32.0",
  "celery==5.4.0",
  "redis==5.2.0",
  "sqlalchemy==2.0.36",
  "asyncpg==0.30.0",
  "pandera==0.22.1",
  "pyarrow==17.0.0",
  # [NEW-DEP] Required by the P1 gate for online feature retrieval and latency measurement.
  "feast[serving]==0.66.0",
  "onnx==1.17.0",
  "onnxruntime==1.20.1",
  "prometheus-client==0.21.0",
  # [NEW-DEP] Needed for live Binance websocket ingestion and soak validation.
  "websocket-client==1.8.0",
  "pydantic==2.9.2",
  "pydantic-settings==2.4.0",
  "python-dotenv==1.0.1",
  "pytest==8.3.3",
  "ruff==0.7.3"
]

[tool.setuptools]
packages = [
  "config",
  "ingestion",
  "features",
  "labeling",
  "models",
  "backtest",
  "serving",
  "pipeline",
  "workers",
  "mlops"
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
